<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MSFS App Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ===== HTML STRUCTURE ===== -->
<!-- LEFT SIDEBAR - Logo, branding, and game info -->
<div class="side">
  <!-- App logo and title -->
  <div class="brand"><svg width="24" height="24" viewBox="0 0 26 26" fill="none" stroke="#4CC2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15l20-9-7 16-3-7z"/></svg>Launchpad</div>
  <div class="lbl" style="padding:0 8px 4px">Games</div>
  <!-- Shows current sim name and app count (hidden until a game is added) -->
  <div class="game" id="game" hidden><span id="gname"></span><small id="gcount"></small></div>
  <!-- Pick the game's exe; its file name is used as the process to watch for -->
  <button class="ghost" data-act="addgame" id="addgame">+ Add game</button>
  <!-- LOGS PANEL - Live activity logs -->
  <div class="logs-panel" id="logspanel">
    <div class="logs-header">
      <div class="logs-title">Activity Log</div>
      <button class="logs-close" id="logstoggle" aria-label="Toggle logs"><svg class="dd-chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></button>
    </div>
    <div class="logs-content" id="logscontent"></div>
  </div>
  <!-- SETTINGS - opens the settings page in the main area -->
  <button class="side-btn" data-act="settings"><span class="logs-title">Settings</span></button>
</div>

<!-- MAIN CONTENT AREA - App list and controls -->
<div class="main" id="main">
  <!-- Header with title and Add App button -->
  <div class="hd">
    <div>
      <div class="title-row">
        <h1 id="title"></h1>
        <!-- Sim status (state pushed from gui.py via window.onSimState) -->
        <span class="simpill" id="simpill" data-state="off" hidden><i></i><span id="simtext">Not running</span></span>
      </div>
      <!-- Display current game executable -->
      <div class="sub" id="watch">Watching for <span id="sim" style="font-weight:500"></span></div>
    </div>
    <div class="hd-actions">
      <!-- Starts the selected game through the Xbox app or Steam -->
      <button class="sec hbtn simbtn" id="launchsim" hidden><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.8v8.4a.6.6 0 0 0 .9.5l6.9-4.2a.6.6 0 0 0 0-1L3.9 1.3a.6.6 0 0 0-.9.5z" fill="currentColor"/></svg><span id="launchsimtext">Start MSFS</span></button>
      <!-- Button to add new app -->
      <button class="pri hbtn" id="add"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Add app</button>
    </div>
  </div>
  <!-- App counter label -->
  <div class="lbl" id="count"></div>
  <!-- Container for app cards list - populated by JavaScript -->
  <div class="list" id="list"></div>
  <!-- Footer with status message and Save button -->
  <div class="ft" id="ft"><span id="status">Changes apply the next time the sim starts.</span>
    <button class="pri" id="save">Save</button></div>
</div>

<!-- RIGHT DETAILS PANEL - Edit selected app settings -->
<div class="det" id="det"></div>

<!-- SETTINGS PAGE - standalone page, replaces the main area and details panel -->
<div class="spage" id="settingspage" hidden></div>

<!-- Reusable markup for UI rendered from the current configuration. -->
<template id="tpl-log-entry">
  <div class="log-entry info">
    <div class="log-timestamp">
      <div class="log-date"></div>
      <div class="log-time"></div>
    </div>
    <div class="log-msg"></div>
  </div>
</template>

<template id="tpl-game-picker">
  <div class="lbl">Choose your game</div>
  <div class="game-options"></div>
  <div><button class="sec" data-act="gamecancel">Cancel</button></div>
</template>
<template id="tpl-game-option">
  <div class="card" data-game="">
    <div class="tile"></div>
    <div class="nm"><b></b><span></span></div>
  </div>
</template>
<template id="tpl-no-game">
  <div class="empty">Add the game you fly (for example MSFS 2024), so the launcher knows which program to watch for.<br><br><button class="pri" data-act="addgame">+ Add game</button></div>
</template>
<template id="tpl-no-apps">
  <div class="empty">No apps yet. Click "Add app" to pick one.</div>
</template>
<template id="tpl-app-card">
  <div class="card" draggable="false">
    <span class="grip" title="Drag to reorder">
      <svg width="14" height="18" viewBox="0 0 14 18" fill="currentColor" aria-hidden="true"><circle cx="4" cy="4" r="1.5"/><circle cx="10" cy="4" r="1.5"/><circle cx="4" cy="9" r="1.5"/><circle cx="10" cy="9" r="1.5"/><circle cx="4" cy="14" r="1.5"/><circle cx="10" cy="14" r="1.5"/></svg>
    </span>
    <div class="tile"></div>
    <div class="nm"><b></b><span></span></div>
    <div class="chips"></div>
    <button class="tog" aria-label="Enabled" aria-pressed="false"><i></i></button>
  </div>
</template>
<template id="tpl-chip"><span class="chip"></span></template>
<template id="tpl-detail-empty">
  <div class="empty">Add a game first, then add the apps you want to launch with it.</div>
</template>
<template id="tpl-select-empty">
  <div class="empty">Select an app to edit it.</div>
</template>
<template id="tpl-app-detail">
  <div class="dh">
    <div class="tile"></div>
    <div class="dt">
      <input class="title-in" id="f-name" aria-label="Name" spellcheck="false">
      <span class="path"></span>
    </div>
  </div>
  <div class="fl">
    <span class="lbl">Start</span>
    <div class="seg">
      <button data-set="start" data-v="sim">With sim</button>
      <button data-set="start" data-v="session">In Session</button>
    </div>
    <span class="hint" data-field="start-hint"></span>
  </div>
  <div class="fl">
    <label class="lbl" for="f-delay">Delay (seconds)</label>
    <div class="dl">
      <input class="num" id="f-delay" type="number" min="0">
      <div class="spins">
        <button type="button" data-spin="up">▲</button>
        <button type="button" data-spin="down">▼</button>
      </div>
    </div>
    <span class="hint" data-field="delay-hint"></span>
  </div>
  <div class="fl">
    <span class="lbl">Behavior</span>
    <div class="opt">Close when sim exits<button class="tog" data-flag="closeOnExit" aria-label="Close when sim exits" aria-pressed="false"><i></i></button></div>
  </div>
  <div class="fl">
    <span class="lbl">Window</span>
    <div class="opt">Start minimized<button class="tog" data-flag="minimized" aria-label="Start minimized" aria-pressed="false"><i></i></button></div>
    <span class="hint">On by default. Turn off to open in a normal window.</span>
  </div>
  <div class="fl">
    <label class="lbl" for="f-args">Launch arguments</label>
    <input class="inp" id="f-args" placeholder="Optional" spellcheck="false">
  </div>
  <div class="row" style="margin-top:auto"><button class="sec dng" id="remove" style="flex:1">Remove</button></div>
</template>

<template id="tpl-settings">
  <div class="spage-in">
    <div class="spage-hd">
      <div>
        <div class="spage-title">Settings</div>
        <div class="spage-sub">Changes are saved automatically.</div>
      </div>
      <button class="sec" data-act="settingsback">&larr; Back to apps</button>
    </div>

    <div class="scard">
      <div class="scard-t">Startup</div>
      <div class="srow">
        <div class="stxt"><b>Launch with MSFS</b><span>Open this app automatically when the sim starts.</span></div>
        <button class="tog" data-setting="launchWithMSFS" aria-label="Launch with MSFS" aria-pressed="false"><i></i></button>
      </div>
      <div class="srow">
        <div class="stxt"><b>Close with MSFS</b><span>Close this app when the sim exits.</span></div>
        <button class="tog" data-setting="closeWithMSFS" aria-label="Close with MSFS" aria-pressed="false"><i></i></button>
      </div>
      <div class="srow">
        <div class="stxt"><b>Start minimized</b><span>Open in the background without showing the window.</span></div>
        <button class="tog" data-setting="startMinimized" aria-label="Start minimized" aria-pressed="false"><i></i></button>
      </div>
    </div>

    <div class="scard">
      <div class="scard-t">Window behavior</div>
      <div class="srow">
        <div class="stxt"><b>Close button</b><span>What the X button does.</span></div>
        <select data-setting="closeButtonAction" aria-label="Close button action">
          <option value="tray">Minimize to tray</option>
          <option value="exit">Exit</option>
        </select>
      </div>
      <div class="srow">
        <div class="stxt"><b>Minimize button</b><span>What the minimize button does.</span></div>
        <select data-setting="minimizeButtonAction" aria-label="Minimize button action">
          <option value="tray">Minimize to tray</option>
          <option value="taskbar">Minimize to taskbar</option>
        </select>
      </div>
    </div>

    <div class="scard">
      <div class="scard-t">MSFS integration</div>
      <div id="xlist"><div class="xempty">Checking...</div></div>
    </div>
  </div>
</template>

<!-- One MSFS installation in Settings > MSFS integration -->
<template id="tpl-xrow">
  <div class="xrow">
    <span class="xdot" aria-hidden="true"></span>
    <div class="xtxt">
      <b class="xname"></b>
      <span class="xmsg"></span>
      <code class="xpath"></code>
      <span class="xnote"></span>
    </div>
    <div class="xbtns"></div>
  </div>
</template>

<!-- First-run question: connect to exe.xml -->
<template id="tpl-setup">
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="mtitle" id="mtitle">Start with MSFS automatically?</div>
    <p class="mtext">Add this launcher to MSFS's <b>exe.xml</b> so your apps start whenever the sim does. A backup of the original exe.xml is saved first, and you can undo this any time in Settings.</p>
    <div class="mlist"></div>
    <div class="mbtns">
      <button class="sec" id="msetup-skip">Not now</button>
      <button class="pri" id="msetup-add">Add to exe.xml</button>
    </div>
  </div>
</template>

<template id="tpl-mrow">
  <div class="mrow">
    <span class="xdot" aria-hidden="true"></span>
    <div class="xtxt">
      <b class="xname"></b>
      <code class="xpath"></code>
      <span class="xnote"></span>
    </div>
  </div>
</template>

<div class="modal" id="modal" hidden></div>

<script src="app.js"></script>
</body>
</html>
